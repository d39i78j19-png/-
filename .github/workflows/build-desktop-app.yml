name: デスクトップアプリのビルド

# Windows の .exe と macOS の .dmg は、それぞれの OS 上でしかビルドできない。
# タグを打つか、手動実行すると 3 OS 分の配布物ができあがる。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release を作成する場合はタグ名を入力（例: v0.1.0）。空ならビルドのみ"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.exe インストーラ)
            command: npm run app:win
          - os: macos-latest
            label: macOS (.dmg / Intel + Apple Silicon)
            command: npm run app:mac
          - os: ubuntu-latest
            label: Linux (AppImage)
            command: npm run app:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: ビルド
        run: ${{ matrix.command }}
        env:
          # 署名は行わない。受け取り側の初回起動手順は README に記載。
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 配布物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: persona-studio-${{ runner.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  # タグ push、または手動実行で release_tag を指定したときに
  # 3 OS 分をまとめて Release に添付する
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 添付するファイルを確認
        run: find artifacts -type f -printf '%s\t%p\n' | sort -rn

      # gh はランナーに標準搭載されているので、サードパーティ Action への
      # 依存を増やさずに Release を作れる
      # gh release create はタグが無ければ現在のコミットに作成してくれるので、
      # タグ push でも手動実行でも同じ手順で済む
      - name: Release を作成して配布物を添付
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            $(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \))
          echo "Release URL: $(gh release view "$TAG" --json url --jq .url)"
